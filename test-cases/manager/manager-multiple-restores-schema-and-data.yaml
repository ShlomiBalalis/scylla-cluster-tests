test_duration: 2100

instance_type_db: 'i3en.2xlarge'
stress_read_cmd: "cassandra-stress read cl=QUORUM n=10485760 -schema 'keyspace=10gb_sizetiered replication(factor=3) compaction(strategy=SizeTieredCompactionStrategy)' -mode cql3 native  -rate threads=50 -col 'size=FIXED(64) n=FIXED(16)' -pop seq=1..10485760"

# Using this region specifically because the bucket that contain the persistent snapshots that this test use are in us-east-1
region_name: us-east-1
n_db_nodes: 5
n_loaders: 1
n_monitor_nodes: 1

post_behavior_db_nodes: "destroy"
post_behavior_loader_nodes: "destroy"
post_behavior_monitor_nodes: "destroy"

user_prefix: manager-regression
