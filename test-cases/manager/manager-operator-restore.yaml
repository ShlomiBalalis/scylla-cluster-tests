test_duration: 200

prepare_write_cmd:  "cassandra-stress write cl=QUORUM n=4000000 -schema 'replication(factor=1) compaction(strategy=LeveledCompactionStrategy)' -mode cql3 native -rate threads=50 -col 'size=FIXED(64) n=FIXED(16)' -pop seq=400000000..600000000"
stress_read_cmd: "cassandra-stress read cl=QUORUM n=4000000 -schema 'replication(factor=1) compaction(strategy=LeveledCompactionStrategy)' -mode cql3 native -rate threads=50 -col 'size=FIXED(64) n=FIXED(16)' -pop seq=400000000..600000000"

n_db_nodes: 3
k8s_n_scylla_pods_per_cluster: 3
n_loaders: 2
n_monitor_nodes: 1
instance_type_db: 'i3.4xlarge'

mgmt_docker_image: 'scylladb/scylla-manager:3.1.0-rc0-0.20230331.2a37e91eb03'

user_prefix: manager-operator-restore
