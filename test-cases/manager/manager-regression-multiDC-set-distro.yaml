test_duration: 240

prepare_write_cmd: "cassandra-stress write cl=QUORUM n=4000000 -schema 'replication(factor=2)' -mode cql3 native -rate threads=200 -pop seq=1..4000000"
stress_read_cmd: "cassandra-stress read cl=QUORUM n=5000000 -schema 'replication(factor=2)' -mode cql3 native -rate threads=200 -pop seq=1..5000000"

instance_type_db: 'i3.large'
instance_type_loader: 'c5.large'

region_name: us-east-1
n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

post_behavior_db_nodes: "destroy"
post_behavior_loader_nodes: "destroy"
post_behavior_monitor_nodes: "destroy"

user_prefix: manager-regression
space_node_threshold: 6442

aws_instance_profile_name_db: 'qa-scylla-manager-backup-instance-profile'

ami_monitor_user: 'centos'
ami_id_monitor: 'ami-02eac2c0129f6376b' # Official CentOS Linux 7 x86_64 HVM EBS ENA 1901_01
